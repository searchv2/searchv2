# shortcut: monitoring uses emptyDir and loses history on pod replacement; add PVCs when history must persist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: devops
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      automountServiceAccountToken: false
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.123.0
        ports:
        - name: grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: metrics
          containerPort: 8889
        - name: health
          containerPort: 13133
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        args:
        - --config=/etc/otel-collector/otel-collector.yaml
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - name: otel-collector
          mountPath: /etc/otel-collector
          readOnly: true
      volumes:
      - name: otel-collector
        configMap:
          name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: devops
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
  - name: grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: metrics
    port: 8889
    targetPort: 8889
  - name: health
    port: 13133
    targetPort: 13133
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: devops
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: prom/prometheus:v3.4.1
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        args:
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /-/ready
            port: 9090
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - name: data
          mountPath: /prometheus
        - name: prometheus
          mountPath: /etc/prometheus
          readOnly: true
      volumes:
      - name: prometheus
        configMap:
          name: prometheus
      - name: data
        emptyDir: {}
      securityContext:
        fsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: devops
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
