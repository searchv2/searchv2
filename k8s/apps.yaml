apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: searchv2
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      automountServiceAccountToken: false
      containers:
      - name: search-api
        image: searchv2-search-api:1.0.1
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        imagePullPolicy: Never
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 30
        volumeMounts:
        - name: documents
          mountPath: /data/docs
          readOnly: true
        # Directory mount (not subPath) so Kubernetes can update the flag file in place.
        - name: feature-flags
          mountPath: /config
          readOnly: true
        env:
        # Kubernetes updates the mounted file by swapping a symlink, which .NET's default
        # file watcher does not notice; polling makes flag changes arrive without a restart.
        - name: DOTNET_USE_POLLING_FILE_WATCHER
          value: 'true'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.devops.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: '10000'
        - name: SEARCH_DB_CONNECTION
          value: Host=postgresql-db.database.svc.cluster.local;Port=5432;Database=searchengine;Username=searcher;Gss Encryption Mode=Disable
        - name: SEARCH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: password
        - name: RedisConnectionString
          value: redis.caching.svc.cluster.local:6379
        - name: REDISPASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics
          value: Information
      volumes:
      - name: documents
        hostPath:
          path: /data/searchv2-docs
          type: Directory
      - name: feature-flags
        configMap:
          name: feature-flags
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: searchv2
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blazor
  namespace: searchv2
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: blazor
  template:
    metadata:
      labels:
        app: blazor
    spec:
      automountServiceAccountToken: false
      containers:
      - name: blazor
        image: searchv2-blazor:1.0.1
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        imagePullPolicy: Never
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
          failureThreshold: 30
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.devops.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: '10000'
        - name: SearchApi__BaseUrl
          value: http://search-api:8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: blazor
  namespace: searchv2
spec:
  type: NodePort
  selector:
    app: blazor
  ports:
  - name: http
    port: 8080
    targetPort: 8080
