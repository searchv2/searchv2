global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: postgresql
    static_configs:
      - targets: ['postgresql-db-metrics.database.svc.cluster.local:9187']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
