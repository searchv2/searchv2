# The indexing pipeline (see INDEXING-PIPELINE.md). The Job below is stage 1: it resets the index,
# publishes one message per document and waits until the workers have stored them all. The two
# Deployments after it are stages 2 and 3; scale them independently, for example
#   kubectl --context searchv2 -n searchv2 scale deployment/indexer-writer --replicas=4
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: searchv2
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: indexer
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      volumes:
      - name: documents
        hostPath:
          path: /data/searchv2-docs
          type: Directory
      containers:
      - name: indexer
        image: searchv2-indexer:1.0.1
        imagePullPolicy: Never
        env:
        - name: SEARCH_DB_CONNECTION
          value: Host=postgresql-db.database.svc.cluster.local;Port=5432;Database=searchengine;Username=searcher;Gss Encryption Mode=Disable
        - name: SEARCH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: password
        - name: OTEL_SERVICE_NAME
          value: indexer-pipeline
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.devops.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
        - name: RABBITMQ_HOST
          value: rabbitmq.messaging.svc.cluster.local
        - name: RABBITMQ_USER
          value: searchv2
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        - name: INDEXER_FOLDER
          value: /data/docs
        volumeMounts:
        - name: documents
          mountPath: /data/docs
          readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 2Gi
        command:
        - /bin/sh
        - -ec
        args:
        - |
          test -n "$(find /data/docs -type f -name '*.txt' -print -quit)" || {
            echo 'No .txt files found; refusing to replace the index.' >&2
            exit 1
          }
          exec dotnet indexer.dll pipeline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-tokenizer
  namespace: searchv2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: indexer-tokenizer
  template:
    metadata:
      labels:
        app: indexer-tokenizer
    spec:
      automountServiceAccountToken: false
      volumes:
      - name: documents
        hostPath:
          path: /data/searchv2-docs
          type: Directory
      containers:
      - name: tokenizer
        image: searchv2-indexer:1.0.1
        imagePullPolicy: Never
        args: ["tokenizer"]
        env:
        - name: OTEL_SERVICE_NAME
          value: indexer-tokenizer
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.devops.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
        - name: RABBITMQ_HOST
          value: rabbitmq.messaging.svc.cluster.local
        - name: RABBITMQ_USER
          value: searchv2
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        - name: INDEXER_FOLDER
          value: /data/docs
        volumeMounts:
        - name: documents
          mountPath: /data/docs
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-writer
  namespace: searchv2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: indexer-writer
  template:
    metadata:
      labels:
        app: indexer-writer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: writer
        image: searchv2-indexer:1.0.1
        imagePullPolicy: Never
        args: ["writer"]
        env:
        - name: SEARCH_DB_CONNECTION
          value: Host=postgresql-db.database.svc.cluster.local;Port=5432;Database=searchengine;Username=searcher;Gss Encryption Mode=Disable
        - name: SEARCH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-credentials
              key: password
        - name: OTEL_SERVICE_NAME
          value: indexer-writer
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.devops.svc.cluster.local:4317
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "10000"
        - name: RABBITMQ_HOST
          value: rabbitmq.messaging.svc.cluster.local
        - name: RABBITMQ_USER
          value: searchv2
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
