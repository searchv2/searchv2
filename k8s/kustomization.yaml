apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops
resources:
  - observability.yaml
configMapGenerator:
  - name: otel-collector
    files: [observability/otel-collector.yaml]
  - name: prometheus
    files: [observability/prometheus.yaml, observability/alerts.yaml]
  - name: loki
    files: [observability/loki.yaml]
  - name: grafana-datasources
    files: [observability/datasources.yaml]
  - name: grafana-providers
    files: [observability/dashboards.yaml]
  - name: grafana-dashboard
    files: [observability/searchv2.json]
